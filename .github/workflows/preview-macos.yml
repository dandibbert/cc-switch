name: Preview build (macOS)

# 给开发分支出一个能装上试用的 macOS（Apple Silicon）安装包。
# 不签名、不公证、不出自动更新包：不需要 release.yml 用的那些证书和密钥。
# 产物在这次运行页面底部的 Artifacts 里，保留 14 天。
on:
  push:
    branches:
      - "claude/**"
  workflow_dispatch:

concurrency:
  group: preview-macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned dmg (aarch64)
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: preview-macos-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: preview-macos-cargo-

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install
          pnpm --version

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # 关掉自动更新包（它要私钥签名），用 ad-hoc 签名让 Apple Silicon 能运行。
      - name: Build dmg
        run: >
          pnpm tauri build --target aarch64-apple-darwin --bundles app,dmg
          --config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}'

      - name: Upload dmg
        uses: actions/upload-artifact@v7
        with:
          name: cc-switch-preview-macos-aarch64-${{ github.sha }}
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
